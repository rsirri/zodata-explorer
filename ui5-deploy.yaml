# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zodataexplorer
type: application
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://s4h.pinnacle-consulting.com:44301/
          client: '100'
        app:
          name: ZODATA_EXPLORER
          description: ODATA Service Explorer
          package: ZPS4H
          transport: S4HK903120
        exclude:
          - /test/
  resources:
    excludes:
      - /test/**
      - /localService/**
