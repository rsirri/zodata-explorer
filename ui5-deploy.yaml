# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.kiewit.zodataexplorer
type: application
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: s4pp_100
          url: http://e4d.virtual:443
          client: '100'
        app:
          name: ZODATA_EXPLORER
          description: odata explorer
          package: ZEQP
          transport: E4DK906506
        exclude:
          - /test/
  resources:
    excludes:
      - /test/**
      - /localService/**
